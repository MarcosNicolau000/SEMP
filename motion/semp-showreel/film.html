<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>SEMP — Showreel</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <style>
      :root {
        --ink: #0f172a;
        --paper: #faf8ff;
        --paper-dim: #eaedff;
        --accent: #7e22ce;
        --accent-soft: #f0dbff;
        --accent-mid: #c084fc;
        --slate: #1e293b;
        --muted: #64748b;
        --display: 'Unbounded', sans-serif;
        --ui: 'Inter', sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
        color: var(--ink);
        font-family: var(--ui);
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: none;
      }
      .display {
        font-family: var(--display);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 0.98;
      }
      .ui-bold {
        font-family: var(--ui);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        border-radius: 999px;
        font-family: var(--ui);
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      /* Tactile phone chassis — solid architectural shadow, zero glow */
      .phone {
        position: absolute;
        width: 420px;
        height: 880px;
        border-radius: 52px;
        background: #0b1120;
        padding: 14px;
        border: 4px solid #334155;
        box-shadow: 18px 22px 0 rgba(15, 23, 42, 0.92);
        transform-origin: center center;
      }
      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 40px;
        overflow: hidden;
        background: #faf8ff;
      }
      .phone-screen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
      .phone-notch {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 22px;
        border-radius: 999px;
        background: #0b1120;
        z-index: 5;
      }
      .card-solid {
        background: #ffffff;
        border: 3px solid var(--ink);
        border-radius: 24px;
        box-shadow: 10px 10px 0 var(--ink);
      }
      .card-dark {
        background: #162038;
        border: 3px solid var(--accent);
        border-radius: 24px;
        box-shadow: 10px 10px 0 #050811;
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="film.js"></script>
  </body>
</html>
