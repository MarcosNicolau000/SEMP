      6

<button class="h-16 rounded-2xl bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 active:bg-primary transition-all duration-150" data-key="subtract" type="button">
      -

<!-- Row 4 -->
<button class="h-16 rounded-2xl bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 active:bg-surface-container-high transition-all duration-150" data-val="1" type="button">
      1

<button class="h-16 rounded-2xl bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 active:bg-surface-container-high transition-all duration-150" data-val="2" type="button">

<button class="h-16 rounded-2xl bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 active:bg-surface-container-high transition-all duration-150" data-val="3" type="button">

<button class="h-16 rounded-2xl bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 active:bg-primary transition-all duration-150" data-key="add" type="button">
      +
    </button>
<!-- Row 5 -->
<button class="col-span-2 h-16 rounded-2xl bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-start pl-7 shadow-sm active:scale-[0.98] active:bg-surface-container-high transition-all duration-150" data-val="0" type="button">

<button class="h-16 rounded-2xl bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 active:bg-surface-container-high transition-all duration-150" data-val="," type="button">

<span class="material-symbols-outlined text-[16px] text-outline">verified_user</span>

</div>
<span class="font-label-sm text-label-sm text-outline/80">STD 9482=</span>

<!-- Hidden Mode Modal / Silent Transition Overlay (Appears only on PIN or SOS trigger) -->

<button class="w-full py-3.5 px-4 rounded-xl bg-secondary-container text-on-secondary-container font-label-lg text-label-lg flex items-center justify-between shadow-sm active:opacity-90" id="silent-sos-trigger">

<span class="material-symbols-outlined text-[18px] text-outline">lock_open</span>
</button>
<button class="w-full py-2.5 px-3 rounded-lg text-left bg-surface-container hover:bg-surface-container-high font-body-md text-body-md text-on-surface flex items-center justify-between" id="sheet-clear-history">
<span>Limpar Memória</span>
<span class="material-symbols-outlined text-[18px] text-outline">delete_sweep</span>
</button>

<button class="w-full py-2 mt-1 rounded-lg bg-surface-container-high font-label-md text-label-md text-on-surface text-center" id="close-options-sheet">

      </button>
</div>
</div>

<script>
  (function() {
    let currentInput = '0';
    let previousInput = null;
    let activeOperator = null;
    let resetOnNextNumber = false;

    // Secret codes
    const UNLOCK_PIN = '9482'; // Safe dashboard PIN
    const PANIC_PIN = '1900';  // Direct silent SOS

    const displayEl = document.getElementById('calc-display');
    const historyEl = document.getElementById('calc-history');
    const modalEl = document.getElementById('emergency-modal');
    const optionsSheet = document.getElementById('options-sheet');

    function updateDisplay() {
      displayEl.textContent = currentInput;
    }

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(20);
      }
    }

    function showEmergencyModal() {
      modalEl.classList.remove('hidden');
      requestAnimationFrame(() => {
        modalEl.classList.remove('opacity-0');
      });
    }

    function hideEmergencyModal() {
      modalEl.classList.add('opacity-0');
      setTimeout(() => {
        modalEl.classList.add('hidden');
      }, 300);
    }

    function handleNumber(val) {
      triggerHaptic();
      if (val === ',') {
        if (!currentInput.includes(',')) {
          currentInput += ',';
        }
        updateDisplay();
        return;
      }

      if (currentInput === '0' || resetOnNextNumber) {
        currentInput = val;
        resetOnNextNumber = false;
      } else {
        if (currentInput.length < 12) {
          currentInput += val;
        }
      }
      updateDisplay();
    }

    function handleOperator(op) {
      triggerHaptic();
      const num = parseFloat(currentInput.replace(',', '.'));
      if (previousInput === null) {
        previousInput = num;
      } else if (activeOperator) {
        previousInput = calculate(previousInput, num, activeOperator);
      }
      activeOperator = op;
      historyEl.textContent = `${previousInput} ${op}`;
      resetOnNextNumber = true;
    }

    function calculate(a, b, op) {
      switch(op) {
        case '+': return a + b;
        case '-': return a - b;
        case '×': return a * b;
        case '÷': return b !== 0 ? a / b : 0;
        default: return b;
      }
    }

    function handleEquals() {
      triggerHaptic();
      const rawInput = currentInput.replace(',', '');

      // Check PIN secret triggers
      if (rawInput === UNLOCK_PIN || currentInput === UNLOCK_PIN) {
        showEmergencyModal();
        currentInput = '0';
        updateDisplay();
        return;
      }

      if (rawInput === PANIC_PIN || currentInput === PANIC_PIN) {
        // Direct Silent SOS response simulation
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        displayEl.textContent = "190.00";
        showEmergencyModal();
        return;
      }

      if (activeOperator && previousInput !== null) {
        const num = parseFloat(currentInput.replace(',', '.'));
        const result = calculate(previousInput, num, activeOperator);
        historyEl.textContent = `${previousInput} ${activeOperator} ${num} =`;
        currentInput = String(Number(result.toFixed(6))).replace('.', ',');
        previousInput = null;
        activeOperator = null;
        resetOnNextNumber = true;
        updateDisplay();
      }
    }

    // Bind Keypad Buttons
    document.querySelectorAll('[data-val]').forEach(btn => {
      btn.addEventListener('click', () => handleNumber(btn.getAttribute('data-val')));
    });

    document.querySelectorAll('[data-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        triggerHaptic();

        if (key === 'clear') {
          currentInput = '0';
          previousInput = null;
          activeOperator = null;
          historyEl.textContent = '';
          updateDisplay();
        } else if (key === 'negate') {
          if (currentInput !== '0') {
            if (currentInput.startsWith('-')) {
              currentInput = currentInput.substring(1);
            } else {
              currentInput = '-' + currentInput;
            }
            updateDisplay();
          }
        } else if (key === 'percent') {
          let val = parseFloat(currentInput.replace(',', '.')) / 100;
          currentInput = String(val).replace('.', ',');
          updateDisplay();
        } else if (key === 'add') {
          handleOperator('+');
        } else if (key === 'subtract') {
          handleOperator('-');
        } else if (key === 'multiply') {
          handleOperator('×');
        } else if (key === 'divide') {
          handleOperator('÷');
        }
      });
    });

    document.getElementById('equals-key').addEventListener('click', handleEquals);

    // Stealth Support / Option sheet
    const infoBtn = document.getElementById('info-trigger-btn');
    const closeOptionsBtn = document.getElementById('close-options-sheet');
    infoBtn.addEventListener('click', () => {
      optionsSheet.classList.remove('hidden');
    });
    closeOptionsBtn.addEventListener('click', () => {
      optionsSheet.classList.add('hidden');
    });

    document.getElementById('sheet-open-safe').addEventListener('click', () => {
      optionsSheet.classList.add('hidden');
      showEmergencyModal();
    });

    document.getElementById('sheet-clear-history').addEventListener('click', () => {
      optionsSheet.classList.add('hidden');
      currentInput = '0';
      historyEl.textContent = '';
      updateDisplay();
    });

    // Modal Events
    document.getElementById('close-modal-btn').addEventListener('click', hideEmergencyModal);
    
    document.getElementById('open-semp-dashboard').addEventListener('click', () => {
      hideEmergencyModal();
      // Dispatch or navigate into main app state
      const event = new CustomEvent('semp-navigate', { detail: { screen: 'dashboard' } });
      window.dispatchEvent(event);
    });

    document.getElementById('silent-sos-trigger').addEventListener('click', () => {
      if (navigator.vibrate) {
        navigator.vibrate([150, 100, 150]);
      }
      hideEmergencyModal();
      const event = new CustomEvent('semp-sos-triggered', { detail: { source: 'calculator' } });
      window.dispatchEvent(event);
    });
  })();
</script></main></body></html>
